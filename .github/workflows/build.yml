name: Makefile CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "next-feats/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "next-feats/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        defconfig:
        - raspberrypi4

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Buildroot downloads and ccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildroot-ccache
          ./buildroot/dl
        key: buildroot-${{ matrix.defconfig }}-${{ hashFiles('aa_wireless_dongle/configs/**') }}-${{ github.sha }}
        restore-keys: |
          buildroot-${{ matrix.defconfig }}-${{ hashFiles('aa_wireless_dongle/configs/**') }}-
          buildroot-${{ matrix.defconfig }}-

    - name: Setup config
      run: make BR2_EXTERNAL=../aa_wireless_dongle/ ${{ matrix.defconfig }}_defconfig
      working-directory: ./buildroot

    - name: Build
      run: make
      working-directory: ./buildroot

    - name: Compress sdcard.img
      run: xz -T0 -c sdcard.img > ${{ matrix.defconfig }}-sdcard.img.xz
      working-directory: ./buildroot/output/images

    - uses: actions/upload-artifact@v4
      with:
        name: WirelessAndroidAutoDongle-${{ matrix.defconfig }}
        path: ./buildroot/output/images/${{ matrix.defconfig }}-sdcard.img.xz
  
  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: WirelessAndroidAutoDongle-all
          pattern: WirelessAndroidAutoDongle-*
