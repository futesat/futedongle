#!/bin/sh

######## Opciones de Configuración para Android Auto Wireless Dongle ########

## Código de país regulatorio (ISO/IEC 3166-1 alfa-2)
## Establece el dominio regulatorio para la red Wi-Fi (potencias y canales permitidos según el país).
AAWG_COUNTRY_CODE=ES


## Estrategia de conexión de Android Auto
## 0 - Modo Dongle: Espera a que conecten tanto el Bluetooth del teléfono como el de la radio del coche, y luego inicia Wi-Fi y USB.
## 1 - Teléfono primero (predeterminado / recomendado): Espera a que el teléfono se conecte por Bluetooth y Wi-Fi, y luego activa el gadget USB con el coche.
## 2 - USB primero: Espera a que el coche reconozca la conexión USB primero, y luego inicia Bluetooth y Wi-Fi con el teléfono.
AAWG_CONNECTION_STRATEGY=1


## Intercambio temprano de versión USB (Early USB Version Handshake)
## Negocia el protocolo con la unidad del coche de forma anticipada para evitar que la radio cancele la conexión por timeout mientras el móvil se conecta.
## 0 - Desactivado (seguro / por defecto con estrategia 1).
## 1 - Activado (requiere que el coche esté conectado al puerto USB al arrancar).
AAWG_EARLY_USB_VERSION_EXCHANGE=0


## Nombre del dispositivo Bluetooth
## Nombre con el que el dongle se anunciará por Bluetooth al teléfono móvil.
AAWG_BLUETOOTH_NAME=futedongle

## Sufijo opcional para el nombre de Bluetooth
## Añade un texto identificativo al final del nombre Bluetooth (opcional, ej: _coche).
#AAWG_UNIQUE_NAME_SUFFIX=


## Nombre de la red Wi-Fi (SSID)
## Nombre del punto de acceso Wi-Fi (5 GHz) emitido por el dongle para la proyección de Android Auto.
AAWG_WIFI_SSID=futedongle



######## Configuración Avanzada ########

## Contraseña de la red Wi-Fi de Android Auto
## Clave WPA2 fija para que los móviles vinculados recuerden la red sin regenerar claves aleatorias en cada reinicio (mínimo 8 caracteres).
AAWG_WIFI_PASSWORD='ConnectAAWirelessDongle'


## Servidor SSH (Dropbear)
## Habilita el acceso por terminal SSH en el puerto 22.
## Útil para tareas de desarrollo o depuración interna. No recomendado para uso diario.
## 0 - Desactivado (por defecto), 1 - Activado.
#AAWG_ENABLE_SSH=1


## Registro de depuración de arranque en tarjeta SD (/boot/car_debug.log)
## Captura 6 instantáneas de diagnóstico (cada 15s durante los primeros 90s) en la partición FAT32 y luego se detiene.
## 0 - Desactivado (por defecto), 1 - Activado.
AAWG_ENABLE_DEBUG_LOG=0


## Portal Web local de control y diagnóstico (http://10.0.0.1)
## Panel web accesible desde el navegador del móvil conectado al Wi-Fi del dongle para ver estado, telemetría y ajustar configuración.
## 1 - Activado (por defecto), 0 - Desactivado.
AAWG_ENABLE_WEB_PORTAL=1



######## Apertura Inteligente de Garaje (S38garage_opener & S43garage_gate) ########

## Habilitar módulo de apertura automática de garaje
## 1 - Activado, 0 - Desactivado.
AAWG_ENABLE_GARAGE_OPEN=1

## Nombre de la red Wi-Fi (SSID) del router del garaje
AAWG_GARAGE_WIFI_SSID='MyGarageWiFi'

## ¿La red Wi-Fi del garaje tiene el SSID oculto?
## 1 - Oculto (fuerza escaneo activo con scan_ssid=1).
## 0 - Visible (anuncio estándar de beacons).
AAWG_GARAGE_WIFI_HIDDEN=1

## Banda de frecuencia del router del garaje (2.4 o 5 GHz)
## Se recomienda 2.4 para acelerar el escaneo en canales 1 al 13.
AAWG_GARAGE_WIFI_BAND=2.4

## Contraseña WPA/WPA2 de la red Wi-Fi del garaje
AAWG_GARAGE_WIFI_PASSWORD='miPassFake'

## Dirección IP de destino del receptor/controlador del garaje
AAWG_GARAGE_UDP_HOST=192.168.1.50

## Puerto UDP de destino en el controlador del garaje (ej. 9876)
AAWG_GARAGE_UDP_PORT=9876

## Carga útil (payload) enviada por UDP para accionar el relé de la puerta
AAWG_GARAGE_UDP_PAYLOAD='OPEN_GARAGE'

## Tiempo máximo de espera (segundos) para asociarse a la Wi-Fi del garaje y obtener IP en el arranque
AAWG_GARAGE_TIMEOUT_SEC=8

## Tiempo máximo de espera de retención (segundos) hasta detectar el botón START del coche
## Al detectar la Wi-Fi del garaje en el arranque, el dongle mantiene la conexión activa y detiene el inicio de radios
## (sin emitir Wi-Fi ni Bluetooth para el móvil). Al pulsar START, abre la puerta al instante y levanta Android Auto.
## Si transcurre este tiempo sin pulsar START (por ejemplo, si abriste el coche solo para coger algo), se cancela la
## apertura sin abrir la puerta y se levanta Android Auto directamente (no volverá a intentar abrir en todo el viaje).
AAWG_GARAGE_HOLD_TIMEOUT_SEC=120



######## Telemetría OBD-II BLE de Passat GTE (gte_telemetryd) ########

## Demonio de telemetría en tiempo real por Bluetooth de baja energía (BLE GATT)
## Se conecta al adaptador OBD (ej. Vgate iCar Pro 2S) para monitorizar el estado del vehículo en http://10.0.0.1
## y detectar de inmediato el botón START (Borne 15 / READY / subida a >13.5V en batería auxiliar de 12V) para abrir el garaje.
## 1 - Activado, 0 - Desactivado.
AAWG_ENABLE_OBD_TELEMETRY=1

## Dirección MAC Bluetooth BLE fija del adaptador OBD
## Si se especifica (ej. 41:42:86:9B:89:BF), conecta directamente sin realizar escaneo previo, ahorrando varios segundos en el arranque.
## Si se deja vacía o comentada, busca automáticamente adaptadores OBD compatibles.
#AAWG_OBD_BLE_MAC=
